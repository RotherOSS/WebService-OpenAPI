--- 
components:
  schemas:
    LoginData:
      type: object
      properties:
        Password:
          description: The Password of the User performing the operation
          type: string
        UserLogin:
          description: The UserLogin of the User performing the operation
          type: string 
    SessionIdentifier:
      type: object
      properties:
        SessionID:
          description: A valid SessionID of the User performing the operation
          type: string
      required:
        - SessionID
    Credentials:
      oneOf:
        - $ref: '#/components/schemas/LoginData'
        - $ref: '#/components/schemas/SessionIdentifier'
    SessionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/LoginData'
    SessionCreateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - $ref: '#/components/schemas/SessionIdentifier'
    SessionGetRequest:
      allOf:
        - $ref: '#/components/schemas/SessionIdentifier'
    SessionGetResponse:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            SessionData:
              description: Key/Value pairs of SessionInfo 
              type: array
              items:
                type: object
                properties:
                  Key:
                    type: string
                  Value:
                    type: string  

Session::SessionCreate:
  QueryParams:
    GET:
      - description: The UserLogin of the User performing the operation
        in: query
        name: UserLogin
        required: true
        schema:
          example: root@localhost
          type: string
      - description: The Password of the User performing the operation
        in: query
        name: Password
        required: true
        schema:
          example: root
          type: string 
  RequestBody:
    content:
      application/json:
        example:
          Password: root
          UserLogin: root@localhost
        schema:
          $ref: '#/components/schemas/SessionCreateRequest'
    required: true
  Responses:
    200:
      content:
        application/json:
          examples:
            basic:
              value:
                SessionID: "1234567890"
          schema:
            $ref: '#/components/schemas/SessionCreateResponse'
      description: 200 response

Session::SessionGet:
