  QueryParams:
    GET:
    - $ref: '#/components/parameters/UserLogin'
    - $ref: '#/components/parameters/Password'
    - $ref: '#/components/parameters/SessionID'
    - $ref: '#/components/parameters/TicketID'
    - description: Ticketnumber to search for
      in: query
      name: TicketNumber
      required: false
      schema:
        type: string
    - description: Title to search for
      in: query
      name: Title
      required: false
      schema:
        type: string
    - description: Content to search for
      in: query
      name: ContentSearch
      required: false
      schema:
        type: string
    - description: StateType to search for
      in: query
      name: StateType
      required: false
      schema:
        enum:
        - Open
        - Closed
        type: string
    - description: Type to search for
      in: query
      name: Type
      required: false
      schema:
        enum:
        - normal
        - change
        - incident
        type: string
    - description: CustomerID to search for
      in: query
      name: CustomerID
      required: false
      schema:
        type: string
    - description: CustomerUserLogin to search for
      in: query
      name: CustomerUserLogin
      required: false
      schema:
        type: string
    - description: Article FROM to search for
      in: query
      name: MIMEBase_From
      required: false
      schema:
        type: string
    - description: Article TO to search for
      in: query
      name: MIMEBase_To
      required: false
      schema:
        type: string
    - description: Article CCC to search for
      in: query
      name: MIMEBase_Cc
      required: false
      schema:
        type: string
    - description: Article Subject to search for
      in: query
      name: MIMEBase_Subject
      required: false
      schema:
        type: string
    - description: Article Body to search for
      in: query
      name: MIMEBase_Body
      required: false
      schema:
        type: string
    - description: Use FullTextIndex if configured
      in: query
      name: FullTextIndex
      required: false
      schema:
        enum:
        - 0
        - 1
        type: integer
    - description: Age to search for
      in: query
      name: ArticleCreateTimeOlderMinutes
      required: false
      schema:
        type: integer
    - description: Age to search for
      in: query
      name: ArticleCreateTimeNewerMinutes
      required: false
      schema:
        type: integer
    - description: Age to search for
